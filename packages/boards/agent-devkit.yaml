# Based on the ESP32-S3-BOX-3 configuration from
# https://github.com/esphome/wake-word-voice-assistants (Apache-2.0)
# Modified for the Wireless-Tag ESP32 Agent Dev Kit (AD35-S3)
#
# Hardware package for the Wireless-Tag ESP32 Agent Dev Kit (AD35-S3): everything that is
# specific to this board. The shared packages (core, voice, hud) expect these ids from here:
#
#   box_mic / box_speaker   microphone and speaker, 16 kHz / 16 bit on one duplex I2S bus
#   lcd / touch             display and touchscreen for LVGL
#   backlight               a light the HUD dims and restores
#
# and this file calls these from the shared packages: wake_screen, screen_touched (hud.yaml).
#
# Audio: ES7210 microphone ADC and ES8311 speaker DAC in full duplex on one I2S bus, HT6872
# amplifier enabled through the AW9523 IO expander. ST7796U display on an 8-bit 8080 bus,
# FT6336U touch, MK-PB2016PS proximity sensor.
#
# Pinout source: vendor schematic rev V1.1, see docs/pinout.md.
# Tested on: ESPHome 2026.9.1 + Home Assistant 2026.10 (2026-10-11).

substitutions:
  hud_title: "AGENT // DEVKIT"

  # I2C (shared by ES8311, ES7210, AW9523, touch, proximity sensor)
  i2c_sda: GPIO5
  i2c_scl: GPIO4
  i2c_addr_es8311: "0x18"
  i2c_addr_es7210: "0x40"
  i2c_addr_aw9523: "0x59"
  i2c_addr_proximity: "0x39"

  # I2S (shared by ES8311 and ES7210)
  i2s_mclk: GPIO47
  i2s_bclk: GPIO14
  i2s_lrclk: GPIO13
  i2s_dout: GPIO12   # ESP -> ES8311 (net ES_DAIN)
  i2s_din: GPIO21    # ES7210 -> ESP (net ES_ADOUT)

  # AW9523 pins: 0-7 = P0_0..P0_7, 8-15 = P1_0..P1_7
  aw9523_pa_ctrl: "13"   # P1_5, HT6872 amplifier enable (net ES_CTRL)
  aw9523_lcd_rst: "14"   # P1_6, LCD + touch reset

  # LCD: ST7796U on an 8-bit 8080 bus
  lcd_wr: GPIO10
  lcd_dc: GPIO45
  lcd_d0: GPIO9
  lcd_d1: GPIO3
  lcd_d2: GPIO8
  lcd_d3: GPIO18
  lcd_d4: GPIO17
  lcd_d5: GPIO16
  lcd_d6: GPIO15
  lcd_d7: GPIO7
  touch_int: GPIO6

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

external_components:
  # Components ESPHome core lacks, kept in this repo (Apache-2.0):
  #   aw9523     - IO expander / LED driver (amplifier enable, LCD reset, backlight)
  #   mipi_i80   - 8080 / i80 parallel display driver (ST7796U)
  #   mkpb2016ps - the board's IR proximity sensor (presence wakes the screen)
  # The shared i2s_audio and voice_assistant copies are listed in packages/core.yaml.
  - source: ${components_source}
    components: [aw9523, mipi_i80, mkpb2016ps]
    refresh: 1d

logger:
  # ESP32-S3 defaults to the native USB-JTAG console (rear USB-C). The CH343P on the
  # bottom USB-C is wired to UART0, so force logs there.
  hardware_uart: UART0

i2c:
  - id: bus_a
    sda: ${i2c_sda}
    scl: ${i2c_scl}
    frequency: 400kHz
    scan: true

aw9523:
  - id: io_expander
    i2c_id: bus_a
    address: ${i2c_addr_aw9523}
    led_current_limit: 37mA

# ---------------------------------------------------------------------------
# Audio
# ---------------------------------------------------------------------------
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: ${i2s_lrclk}
    i2s_bclk_pin: ${i2s_bclk}
    i2s_mclk_pin: ${i2s_mclk}
    # One TX+RX pair that runs from the first use on; see components/i2s_audio.
    duplex: true

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_a
    address: ${i2c_addr_es7210}
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    address: ${i2c_addr_es8311}
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: box_mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: ${i2s_din}
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: ${i2s_dout}
    dac_type: external
    audio_dac: es8311_dac
    # Duplex bus: speaker and microphone share the clocks, so both run at 16 kHz / 16 bit
    # (the vendor firmware's setting). "secondary" pins the stream rate so the media player
    # resamples to it instead of trying to reconfigure the bus.
    i2s_mode: secondary
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left
    buffer_duration: 100ms

switch:
  # HT6872 class-D amplifier enable. Always on, like the vendor firmware: with the duplex I2S
  # bus the codec clocks never stop, so there is nothing to pop.
  - platform: gpio
    id: amplifier_enable
    name: Speaker amplifier
    icon: mdi:amplifier
    restore_mode: ALWAYS_ON
    entity_category: config
    pin:
      aw9523: io_expander
      number: ${aw9523_pa_ctrl}
      mode:
        output: true

# ---------------------------------------------------------------------------
# Display: ST7796U 320x480 on an 8-bit 8080 bus, reset and backlight via AW9523
# ---------------------------------------------------------------------------
display:
  - platform: mipi_i80
    id: lcd
    model: ST7796_AD35
    data_pins:
      - ${lcd_d0}
      - ${lcd_d1}
      - ${lcd_d2}
      - ${lcd_d3}
      - ${lcd_d4}
      - ${lcd_d5}
      - ${lcd_d6}
      - ${lcd_d7}
    wr_pin: ${lcd_wr}
    dc_pin: ${lcd_dc}
    panel_select_pins:
      - ${lcd_d0}
      - ${lcd_d3}
    reset_pin:
      aw9523: io_expander
      number: ${aw9523_lcd_rst}
      mode:
        output: true
    pclk_frequency: 20MHz  # ST7796 8-bit write timing; 40 MHz corrupts the image
    # Vendor default orientation is MADCTL 0x48 (mirror X, BGR); rotate 90 for landscape.
    transform:
      mirror_x: true
    update_interval: never
    auto_clear_enabled: false

output:
  # The six AW9523 LED-mode outputs driving the backlight in parallel (vendor firmware: 37 mA max,
  # duty 128/255 at boot).
  - platform: aw9523
    id: bl0
    aw9523: io_expander
    pin: 8
  - platform: aw9523
    id: bl1
    aw9523: io_expander
    pin: 9
  - platform: aw9523
    id: bl2
    aw9523: io_expander
    pin: 10
  - platform: aw9523
    id: bl3
    aw9523: io_expander
    pin: 11
  - platform: aw9523
    id: bl4
    aw9523: io_expander
    pin: 0
  - platform: aw9523
    id: bl5
    aw9523: io_expander
    pin: 1
  - platform: template
    id: backlight_output
    type: float
    write_action:
      - output.set_level:
          id: bl0
          level: !lambda return state;
      - output.set_level:
          id: bl1
          level: !lambda return state;
      - output.set_level:
          id: bl2
          level: !lambda return state;
      - output.set_level:
          id: bl3
          level: !lambda return state;
      - output.set_level:
          id: bl4
          level: !lambda return state;
      - output.set_level:
          id: bl5
          level: !lambda return state;

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    icon: mdi:brightness-6
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms
    initial_state:
      brightness: 100%

touchscreen:
  - platform: ft63x6
    id: touch
    i2c_id: bus_a
    interrupt_pin: ${touch_int}
    display: lcd
    on_touch:
      - script.execute: screen_touched
    # From a 5-point tap test on 2026-10-11 (raw = 1.035*x + 5, raw = 0.976*y + 6).
    calibration:
      x_min: 5
      x_max: 336
      y_min: 6
      y_max: 474

# ---------------------------------------------------------------------------
# Proximity sensor
# ---------------------------------------------------------------------------
sensor:
  # IR proximity sensor on the microphone flex. Raw counts; "Presence threshold" decides what
  # counts as someone standing in front of the device. On the unit this was developed on the
  # sensor reads fine but never sees a reflection (no window in the bezel?), so the threshold
  # defaults to the maximum and presence detection is effectively off until you lower it.
  - platform: mkpb2016ps
    id: proximity
    name: Proximity
    i2c_id: bus_a
    address: ${i2c_addr_proximity}
    update_interval: 250ms
    led_drive: 125mA
    pulse_count: 32
    gain: 4
    entity_category: diagnostic
    filters:
      - delta: 10

number:
  - platform: template
    id: presence_threshold
    name: Presence threshold
    icon: mdi:motion-sensor
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 65535
    step: 10
    initial_value: 65535
    unit_of_measurement: counts

binary_sensor:
  - platform: template
    id: presence
    name: Presence
    device_class: occupancy
    lambda: return id(proximity).state > id(presence_threshold).state;
    filters:
      - delayed_off: 2s
    on_press:
      - script.execute: wake_screen
