# Based on the ESP32-S3-BOX-3 configuration from
# https://github.com/esphome/wake-word-voice-assistants (Apache-2.0)
# Modified for the Wireless-Tag ESP32 Agent Dev Kit (AD35-S3), ported back to the BOX-3
#
# HUD layout for a landscape 320x240 panel (ESP32-S3-BOX-3). Only the LVGL page lives here;
# the widget ids it must define are listed in packages/hud.yaml, which also holds the shared
# fonts and the draw scripts. Same elements as the portrait layout, arranged side by side:
# top bar, core ring with the state text under it on the left, terminal on the right,
# bottom bar with mute and volume.
#
# First seen on hardware 2026-10-13; the coordinates are derived from the portrait layout.

font:
  # Smaller sizes for the state text and the timer digits; the rest comes from hud.yaml.
  - file: gfonts://Orbitron@700
    id: f_display_14
    size: 14
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: gfonts://Share+Tech+Mono
    id: f_mono_26
    size: 26
    bpp: 4
    glyphs: "0123456789:"

lvgl:
  pages:
    - id: main_page
      bg_color: 0x070B12
      bg_image_src: grid_img
      bg_image_tiled: true
      pad_all: 0
      scrollbar_mode: "OFF"
      widgets:
        # ---- top bar (same as the portrait layout, both panels are 320 wide) ----
        - label:
            text: "${hud_title}"
            text_font: f_display_11
            text_color: 0x00E5FF
            text_letter_space: 2
            align: TOP_LEFT
            x: 12
            y: 12
        - obj:
            id: link_dot
            width: 8
            height: 8
            radius: 0
            border_width: 0
            bg_color: 0xFF3B3B
            align: TOP_RIGHT
            x: -66
            y: 13
        - label:
            id: link_label
            text: "NO LINK"
            text_font: f_mono_11
            text_color: 0xFF3B3B
            text_letter_space: 1
            align: TOP_RIGHT
            x: -12
            y: 11
        - obj:
            width: 296
            height: 1
            x: 12
            y: 33
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 12
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 49
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 86
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 123
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 160
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 197
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 234
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 271
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 308
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        # ---- left: core (centre 82,97): brackets, rings, disc, state text ----
        - line:
            id: frame_tl
            points: [[22, 51], [22, 37], [36, 37]]
            line_width: 1
            line_color: 0x2B3647
        - line:
            id: frame_tr
            points: [[128, 37], [142, 37], [142, 51]]
            line_width: 1
            line_color: 0x2B3647
        - line:
            id: frame_bl
            points: [[22, 143], [22, 157], [36, 157]]
            line_width: 1
            line_color: 0x2B3647
        - line:
            id: frame_br
            points: [[128, 157], [142, 157], [142, 143]]
            line_width: 1
            line_color: 0x2B3647
        - obj:
            id: ring_thin
            width: 110
            height: 110
            radius: 55
            x: 27
            y: 42
            bg_opa: TRANSP
            border_width: 1
            border_color: 0x2B3647
            border_opa: 50%
        # Follow-up window: the outer ring becomes an arc that drains while the microphone waits.
        - arc:
            id: follow_arc
            x: 27
            y: 42
            width: 110
            height: 110
            min_value: 0
            max_value: 1000
            value: 1000
            start_angle: 0
            end_angle: 360
            rotation: 270
            adjustable: false
            arc_width: 2
            arc_color: 0x1A2433
            bg_opa: TRANSP
            hidden: true
            indicator:
              arc_color: 0x00E5FF
              arc_width: 2
            knob:
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
        # Second timer: the outer ring becomes a thin amber arc for the next one in line.
        - arc:
            id: timer_arc2
            x: 27
            y: 42
            width: 110
            height: 110
            min_value: 0
            max_value: 1000
            value: 1000
            start_angle: 0
            end_angle: 360
            rotation: 270
            adjustable: false
            arc_width: 2
            arc_color: 0x1A2433
            bg_opa: TRANSP
            hidden: true
            indicator:
              arc_color: 0xA07A00
              arc_width: 2
            knob:
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
        - obj:
            id: ring_main
            width: 96
            height: 96
            radius: 48
            x: 34
            y: 49
            bg_opa: TRANSP
            border_width: 3
            border_color: 0x2B3647
        # Timer: the main ring becomes an arc that empties clockwise, digits in the centre.
        - arc:
            id: timer_arc
            x: 34
            y: 49
            width: 96
            height: 96
            min_value: 0
            max_value: 1000
            value: 1000
            start_angle: 0
            end_angle: 360
            rotation: 270
            adjustable: false
            arc_width: 3
            arc_color: 0x1A2433
            bg_opa: TRANSP
            hidden: true
            indicator:
              arc_color: 0xFFC400
              arc_width: 3
            knob:
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
        - label:
            id: timer_digits
            text: "00:00"
            long_mode: CLIP
            text_font: f_mono_26
            text_color: 0xFFC400
            text_letter_space: 1
            text_align: CENTER
            x: 34
            y: 84
            width: 96
            hidden: true
        - label:
            id: timer_tag
            text: "TIMER"
            text_font: f_display_10
            text_color: 0x4B5A6E
            text_letter_space: 2
            text_align: CENTER
            long_mode: CLIP
            x: 27
            y: 114
            width: 110
            hidden: true
        - spinner:
            id: spin_a
            x: 42
            y: 57
            width: 80
            height: 80
            spin_time: 3s
            arc_length: 60deg
            arc_width: 4
            arc_opa: TRANSP
            hidden: true
            indicator:
              arc_color: 0x00E5FF
              arc_width: 4
        - spinner:
            id: spin_b
            x: 42
            y: 57
            width: 80
            height: 80
            spin_time: 1.2s
            arc_length: 90deg
            arc_width: 4
            arc_opa: TRANSP
            hidden: true
            indicator:
              arc_color: 0xFFC400
              arc_width: 4
        - obj:
            id: phase_disc
            width: 48
            height: 48
            radius: 0
            x: 58
            y: 73
            bg_color: 0x2B3647
            bg_opa: TRANSP
            border_width: 3
            border_color: 0x2B3647
        - label:
            id: follow_digits
            text: "8"
            text_font: f_display_20
            text_color: 0x00E5FF
            text_letter_space: 1
            text_align: CENTER
            x: 58
            y: 87
            width: 48
            hidden: true
        - label:
            id: phase_label
            text: "NO LINK"
            text_font: f_display_14
            text_color: 0xD7E3F0
            text_letter_space: 2
            text_align: CENTER
            long_mode: DOT
            x: 12
            y: 160
            width: 140
        # The longest strings ("WAITING FOR HOME ASSISTANT") do not fit 140 px; scroll those.
        - label:
            id: phase_sub
            text: "WAITING FOR HOME ASSISTANT"
            text_font: f_mono_11
            text_color: 0x4B5A6E
            text_letter_space: 1
            text_align: CENTER
            long_mode: SCROLL_CIRCULAR
            x: 12
            y: 177
            width: 140
        # ---- right: terminal ----
        - obj:
            id: terminal
            x: 160
            y: 42
            width: 148
            height: 146
            radius: 0
            bg_color: 0x0A111B
            border_width: 0
            pad_all: 8
            pad_left: 12
            scrollbar_mode: "OFF"
            widgets:
              - obj:
                  width: 2
                  height: 146
                  x: -12
                  y: -8
                  radius: 0
                  border_width: 0
                  bg_color: 0x00E5FF
              - label:
                  id: you_tag
                  text: "> YOU"
                  text_font: f_mono_11
                  text_color: 0x4B5A6E
                  align: TOP_LEFT
                  y: 0
              # Fixed boxes with an ellipsis: two lines for the question, four for the answer,
              # so long texts never run into each other.
              - label:
                  id: request_label
                  text: ""
                  text_font: f_mono_13
                  text_color: 0x00E5FF
                  long_mode: DOT
                  width: 128
                  height: 32
                  align: TOP_LEFT
                  y: 13
              - label:
                  id: sys_tag
                  text: "> SYS"
                  text_font: f_mono_11
                  text_color: 0x4B5A6E
                  align: TOP_LEFT
                  y: 49
              - label:
                  id: response_label
                  text: ""
                  text_font: f_mono_13
                  text_color: 0xD7E3F0
                  long_mode: DOT
                  width: 128
                  height: 68
                  align: TOP_LEFT
                  y: 62
        # ---- bottom bar: mute + segmented volume ----
        - obj:
            id: bottom_bar
            width: 320
            height: 46
            align: BOTTOM_MID
            radius: 0
            bg_color: 0x060A10
            border_width: 1
            border_side: TOP
            border_color: 0x141C28
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              - button:
                  id: mute_button
                  width: 64
                  height: 30
                  x: 12
                  align: LEFT_MID
                  checkable: true
                  radius: 0
                  bg_color: 0x060A10
                  border_width: 1
                  border_color: 0x00E5FF
                  shadow_width: 0
                  checked:
                    bg_color: 0xFF2B74
                    border_color: 0xFF2B74
                  widgets:
                    - label:
                        id: mute_label
                        text: "MUTE"
                        text_font: f_display_10
                        text_color: 0x00E5FF
                        text_letter_space: 2
                        align: CENTER
                  on_click:
                    - switch.toggle: mute
              - label:
                  text: "VOL"
                  text_font: f_mono_11
                  text_color: 0x4B5A6E
                  text_letter_space: 1
                  x: 86
                  y: 6
              - label:
                  id: vol_value
                  text: "50"
                  text_font: f_mono_11
                  text_color: 0x00E5FF
                  align: TOP_RIGHT
                  x: -12
                  y: 6
              - obj:
                  id: vol_segments
                  x: 86
                  y: 24
                  width: 222
                  height: 10
                  radius: 0
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  widgets:
                    - obj:
                        id: seg0
                        width: 12
                        height: 10
                        x: 0
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg1
                        width: 12
                        height: 10
                        x: 14
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg2
                        width: 12
                        height: 10
                        x: 28
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg3
                        width: 12
                        height: 10
                        x: 42
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg4
                        width: 12
                        height: 10
                        x: 56
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg5
                        width: 12
                        height: 10
                        x: 70
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg6
                        width: 12
                        height: 10
                        x: 84
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg7
                        width: 12
                        height: 10
                        x: 98
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg8
                        width: 12
                        height: 10
                        x: 112
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg9
                        width: 12
                        height: 10
                        x: 126
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg10
                        width: 12
                        height: 10
                        x: 140
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg11
                        width: 12
                        height: 10
                        x: 154
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg12
                        width: 12
                        height: 10
                        x: 168
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg13
                        width: 12
                        height: 10
                        x: 182
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg14
                        width: 12
                        height: 10
                        x: 196
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg15
                        width: 12
                        height: 10
                        x: 210
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
              # transparent slider on top of the segments for touch
              - slider:
                  id: volume_slider
                  x: 82
                  y: 16
                  width: 230
                  height: 26
                  min_value: 0
                  max_value: 100
                  value: 50
                  bg_opa: TRANSP
                  indicator:
                    bg_opa: TRANSP
                  knob:
                    bg_opa: TRANSP
                    border_width: 0
                  on_value:
                    - script.execute:
                        id: draw_volume
                        level: !lambda return (int) x;
                  on_release:
                    - media_player.volume_set:
                        id: speaker_media_player
                        volume: !lambda return x / 100.0;
                    # confirmation tick at the new volume
                    - media_player.speaker.play_on_device_media_file:
                        media_file: command_sound
                        announcement: true
