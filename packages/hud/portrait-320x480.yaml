# Based on the ESP32-S3-BOX-3 configuration from
# https://github.com/esphome/wake-word-voice-assistants (Apache-2.0)
# Modified for the Wireless-Tag ESP32 Agent Dev Kit (AD35-S3)
#
# HUD layout for a portrait 320x480 panel (Agent Dev Kit). Only the LVGL page lives here;
# the widget ids it must define are listed in packages/hud.yaml, which also holds the
# fonts and the draw scripts. Top bar, core ring with the state text under it, terminal,
# bottom bar with mute and volume.

font:
  # Timer digits in the ring; the rest comes from hud.yaml.
  - file: gfonts://Share+Tech+Mono
    id: f_mono_34
    size: 34
    bpp: 4
    glyphs: "0123456789:"

lvgl:
  pages:
    - id: main_page
      bg_color: 0x070B12
      bg_image_src: grid_img
      bg_image_tiled: true
      pad_all: 0
      scrollbar_mode: "OFF"
      widgets:
        # ---- top bar ----
        - label:
            text: "${hud_title}"
            text_font: f_display_11
            text_color: 0x00E5FF
            text_letter_space: 2
            align: TOP_LEFT
            x: 12
            y: 12
        - obj:
            id: link_dot
            width: 8
            height: 8
            radius: 0
            border_width: 0
            bg_color: 0xFF3B3B
            align: TOP_RIGHT
            x: -66
            y: 13
        - label:
            id: link_label
            text: "NO LINK"
            text_font: f_mono_11
            text_color: 0xFF3B3B
            text_letter_space: 1
            align: TOP_RIGHT
            x: -12
            y: 11
        - obj:
            width: 296
            height: 1
            x: 12
            y: 33
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 12
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 49
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 86
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 123
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 160
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 197
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 234
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 271
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 308
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        # ---- core: brackets, rings, disc, labels ----
        - line:
            id: frame_tl
            points: [[63, 64], [63, 50], [77, 50]]
            line_width: 1
            line_color: 0x2B3647
        - line:
            id: frame_tr
            points: [[243, 50], [257, 50], [257, 64]]
            line_width: 1
            line_color: 0x2B3647
        - line:
            id: frame_bl
            points: [[63, 230], [63, 244], [77, 244]]
            line_width: 1
            line_color: 0x2B3647
        - line:
            id: frame_br
            points: [[243, 244], [257, 244], [257, 230]]
            line_width: 1
            line_color: 0x2B3647
        - obj:
            id: ring_thin
            width: 166
            height: 166
            radius: 83
            align: TOP_MID
            y: 64
            bg_opa: TRANSP
            border_width: 1
            border_color: 0x2B3647
            border_opa: 50%
        # Follow-up window: the outer ring becomes an arc that drains while the microphone waits.
        - arc:
            id: follow_arc
            align: TOP_MID
            y: 64
            width: 166
            height: 166
            min_value: 0
            max_value: 1000
            value: 1000
            start_angle: 0
            end_angle: 360
            rotation: 270
            adjustable: false
            arc_width: 2
            arc_color: 0x1A2433
            bg_opa: TRANSP
            hidden: true
            indicator:
              arc_color: 0x00E5FF
              arc_width: 2
            knob:
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
        - obj:
            id: ring_main
            width: 146
            height: 146
            radius: 73
            align: TOP_MID
            y: 74
            bg_opa: TRANSP
            border_width: 3
            border_color: 0x2B3647
        # Timer: the main ring becomes an arc that empties clockwise, digits in the centre.
        - arc:
            id: timer_arc
            align: TOP_MID
            y: 74
            width: 146
            height: 146
            min_value: 0
            max_value: 1000
            value: 1000
            start_angle: 0
            end_angle: 360
            rotation: 270
            adjustable: false
            arc_width: 3
            arc_color: 0x1A2433
            bg_opa: TRANSP
            hidden: true
            indicator:
              arc_color: 0xFFC400
              arc_width: 3
            knob:
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
        - label:
            id: timer_digits
            text: "00:00"
            text_font: f_mono_34
            text_color: 0xFFC400
            text_letter_space: 1
            align: TOP_MID
            y: 126
            hidden: true
        - label:
            id: timer_tag
            text: "TIMER"
            text_font: f_display_10
            text_color: 0x4B5A6E
            text_letter_space: 3
            align: TOP_MID
            y: 168
            hidden: true
        - spinner:
            id: spin_a
            align: TOP_MID
            y: 86
            width: 122
            height: 122
            spin_time: 3s
            arc_length: 60deg
            arc_width: 4
            arc_opa: TRANSP
            hidden: true
            indicator:
              arc_color: 0x00E5FF
              arc_width: 4
        - spinner:
            id: spin_b
            align: TOP_MID
            y: 86
            width: 122
            height: 122
            spin_time: 1.2s
            arc_length: 90deg
            arc_width: 4
            arc_opa: TRANSP
            hidden: true
            indicator:
              arc_color: 0xFFC400
              arc_width: 4
        - obj:
            id: phase_disc
            width: 70
            height: 70
            radius: 0
            align: TOP_MID
            y: 112
            bg_color: 0x2B3647
            bg_opa: TRANSP
            border_width: 3
            border_color: 0x2B3647
        - label:
            id: follow_digits
            text: "8"
            text_font: f_display_20
            text_color: 0x00E5FF
            text_letter_space: 1
            align: TOP_MID
            y: 136
            hidden: true
        - label:
            id: phase_label
            text: "NO LINK"
            text_font: f_display_20
            text_color: 0xD7E3F0
            text_letter_space: 3
            align: TOP_MID
            y: 242
        - label:
            id: phase_sub
            text: "WAITING FOR HOME ASSISTANT"
            text_font: f_mono_11
            text_color: 0x4B5A6E
            text_letter_space: 1
            align: TOP_MID
            y: 272
        # ---- terminal ----
        - obj:
            id: terminal
            x: 12
            y: 288
            width: 296
            height: 126
            radius: 0
            bg_color: 0x0A111B
            border_width: 0
            pad_all: 8
            pad_left: 12
            scrollbar_mode: "OFF"
            widgets:
              - obj:
                  width: 2
                  height: 126
                  x: -12
                  y: -8
                  radius: 0
                  border_width: 0
                  bg_color: 0x00E5FF
              - label:
                  id: you_tag
                  text: "> YOU"
                  text_font: f_mono_11
                  text_color: 0x4B5A6E
                  align: TOP_LEFT
                  y: 0
              # Fixed boxes with an ellipsis: two lines for the question, three for the answer,
              # so long texts never run into each other.
              - label:
                  id: request_label
                  text: ""
                  text_font: f_mono_13
                  text_color: 0x00E5FF
                  long_mode: DOT
                  width: 274
                  height: 34
                  align: TOP_LEFT
                  y: 13
              - label:
                  id: sys_tag
                  text: "> SYS"
                  text_font: f_mono_11
                  text_color: 0x4B5A6E
                  align: TOP_LEFT
                  y: 50
              - label:
                  id: response_label
                  text: ""
                  text_font: f_mono_13
                  text_color: 0xD7E3F0
                  long_mode: DOT
                  width: 274
                  height: 52
                  align: TOP_LEFT
                  y: 63
        # ---- bottom bar: mute + segmented volume ----
        - obj:
            id: bottom_bar
            width: 320
            height: 60
            align: BOTTOM_MID
            radius: 0
            bg_color: 0x060A10
            border_width: 1
            border_side: TOP
            border_color: 0x141C28
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              - button:
                  id: mute_button
                  width: 64
                  height: 36
                  x: 12
                  align: LEFT_MID
                  checkable: true
                  radius: 0
                  bg_color: 0x060A10
                  border_width: 1
                  border_color: 0x00E5FF
                  shadow_width: 0
                  checked:
                    bg_color: 0xFF2B74
                    border_color: 0xFF2B74
                  widgets:
                    - label:
                        id: mute_label
                        text: "MUTE"
                        text_font: f_display_10
                        text_color: 0x00E5FF
                        text_letter_space: 2
                        align: CENTER
                  on_click:
                    - switch.toggle: mute
              - label:
                  text: "VOL"
                  text_font: f_mono_11
                  text_color: 0x4B5A6E
                  text_letter_space: 1
                  x: 90
                  y: 12
              - label:
                  id: vol_value
                  text: "50"
                  text_font: f_mono_11
                  text_color: 0x00E5FF
                  align: TOP_RIGHT
                  x: -12
                  y: 12
              - obj:
                  id: vol_segments
                  x: 90
                  y: 30
                  width: 218
                  height: 12
                  radius: 0
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  widgets:
                    - obj:
                        id: seg0
                        width: 14
                        height: 12
                        x: 0
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg1
                        width: 14
                        height: 12
                        x: 17
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg2
                        width: 14
                        height: 12
                        x: 34
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg3
                        width: 14
                        height: 12
                        x: 51
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg4
                        width: 14
                        height: 12
                        x: 68
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg5
                        width: 14
                        height: 12
                        x: 85
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg6
                        width: 14
                        height: 12
                        x: 102
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg7
                        width: 14
                        height: 12
                        x: 119
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg8
                        width: 14
                        height: 12
                        x: 136
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg9
                        width: 14
                        height: 12
                        x: 153
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg10
                        width: 14
                        height: 12
                        x: 170
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg11
                        width: 14
                        height: 12
                        x: 187
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg12
                        width: 14
                        height: 12
                        x: 204
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg13
                        width: 14
                        height: 12
                        x: 221
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg14
                        width: 14
                        height: 12
                        x: 238
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
                    - obj:
                        id: seg15
                        width: 14
                        height: 12
                        x: 255
                        y: 0
                        radius: 0
                        border_width: 0
                        bg_color: 0x1A2433
              # transparent slider on top of the segments for touch
              - slider:
                  id: volume_slider
                  x: 86
                  y: 22
                  width: 226
                  height: 28
                  min_value: 0
                  max_value: 100
                  value: 50
                  bg_opa: TRANSP
                  indicator:
                    bg_opa: TRANSP
                  knob:
                    bg_opa: TRANSP
                    border_width: 0
                  on_value:
                    - script.execute:
                        id: draw_volume
                        level: !lambda return (int) x;
                  on_release:
                    - media_player.volume_set:
                        id: speaker_media_player
                        volume: !lambda return x / 100.0;
                    # confirmation tick at the new volume
                    - media_player.speaker.play_on_device_media_file:
                        media_file: command_sound
                        announcement: true
