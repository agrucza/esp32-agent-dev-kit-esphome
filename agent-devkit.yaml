              arc_color: 0x00E5FF
              arc_width: 4
        - spinner:
            id: spin_b
            align: TOP_MID
            y: 86
            width: 122
            height: 122
            spin_time: 1.2s
            arc_length: 90deg
            arc_width: 4
            arc_opa: TRANSP
