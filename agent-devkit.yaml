            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 86
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 123
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 160
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 197
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 234
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 271
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 308
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        # ---- core: brackets, rings, disc, labels ----
        - line:
            id: frame_tl
            points: [[63, 64], [63, 50], [77, 50]]
            line_width: 1
            line_color: 0x2B3647
        - line:
            id: frame_tr
            points: [[243, 50], [257, 50], [257, 64]]
            line_width: 1
            line_color: 0x2B3647
        - line:
            id: frame_bl
            points: [[63, 230], [63, 244], [77, 244]]
            line_width: 1
            line_color: 0x2B3647
        - line:
            id: frame_br
            points: [[243, 244], [257, 244], [257, 230]]
            line_width: 1
            line_color: 0x2B3647
        - obj:
            id: ring_thin
            width: 166
            height: 166
            radius: 83
            align: TOP_MID
            y: 64
            bg_opa: TRANSP
            border_width: 1
            border_color: 0x2B3647
            border_opa: 50%
        # Follow-up window: the outer ring becomes an arc that drains while the microphone waits.
        - arc:
            id: follow_arc
            align: TOP_MID
            y: 64
            width: 166
            height: 166
            min_value: 0
            max_value: 1000
            value: 1000
            start_angle: 0
            end_angle: 360
            rotation: 270
            adjustable: false
