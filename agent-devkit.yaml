# Based on the ESP32-S3-BOX-3 configuration from
# https://github.com/esphome/wake-word-voice-assistants (Apache-2.0)
# Modified for the Wireless-Tag ESP32 Agent Dev Kit (AD35-S3)
#
# Importable package for the Wireless-Tag ESP32 Agent Dev Kit (AD35-S3). Minimal user config:
#
#   substitutions:
#     name: agent-devkit
#     friendly_name: Agent Dev Kit
#   packages:
#     satellite: github://agrucza/esphome-voice-satellite-hud/agent-devkit.yaml@main
#   esphome:
#     name: ${name}
#     name_add_mac_suffix: false
#   api:
#     encryption:
#       key: !secret api_encryption_key
#   ota:
#     - id: !extend ota_esphome
#       encryption:
#         key: !secret api_encryption_key
#   wifi:
#     ssid: !secret wifi_ssid
#     password: !secret wifi_password
#
# This file only wires the pieces together:
#   packages/boards/agent-devkit.yaml   hardware: pins, codecs, display, touch, backlight, proximity
#   packages/core.yaml                  platform, network, API, OTA, boot sequence
#   packages/voice.yaml                 wake word, voice assistant, sounds, follow-up, timers
#   packages/hud.yaml                   fonts, draw scripts, LVGL base
#   packages/hud/portrait-320x480.yaml  the screen layout for this board's panel
#
# Tested on: ESPHome 2026.9.1 + Home Assistant 2026.10.

substitutions:
  name: agent-devkit
  friendly_name: Agent Dev Kit
  # Where the external components come from. Local development overrides this with a path.
  components_source: github://agrucza/esphome-voice-satellite-hud@main

packages:
  board: !include packages/boards/agent-devkit.yaml
  core: !include packages/core.yaml
  voice: !include packages/voice.yaml
  hud: !include packages/hud.yaml
  layout: !include packages/hud/portrait-320x480.yaml

dashboard_import:
  package_import_url: github://agrucza/esphome-voice-satellite-hud/agent-devkit.yaml@main
  import_full_config: false
