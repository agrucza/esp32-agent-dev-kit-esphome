# Based on the ESP32-S3-BOX-3 configuration from
# https://github.com/esphome/wake-word-voice-assistants (Apache-2.0)
# Modified for the Wireless-Tag ESP32 Agent Dev Kit (AD35-S3)
#
# Importable package. Minimal user config:
#
#   substitutions:
#     name: agent-devkit
#     friendly_name: Agent Dev Kit
#   packages:
#     agent_devkit: github://agrucza/esp32-agent-dev-kit-esphome/agent-devkit.yaml@main
#   esphome:
#     name: ${name}
#     name_add_mac_suffix: false
#   api:
#     encryption:
#       key: !secret api_encryption_key
#   ota:
#     - id: !extend ota_esphome
#       encryption:
#         key: !secret api_encryption_key
#   wifi:
#     ssid: !secret wifi_ssid
#     password: !secret wifi_password
#
# Audio: ES7210 microphone ADC and ES8311 speaker DAC in full duplex on one I2S bus, HT6872
# amplifier enabled through the AW9523 IO expander, on-device wake word, voice assistant,
# ST7796U display with LVGL status page and FT6336U touch.
#
# Pinout source: vendor schematic rev V1.1, see docs/pinout.md.
# Tested on: ESPHome 2026.9.1 + Home Assistant 2026.10 (2026-10-11).

substitutions:
  name: agent-devkit
  friendly_name: Agent Dev Kit
  # Where the external components come from. Local development overrides this with a path.
  components_source: github://agrucza/esp32-agent-dev-kit-esphome@main

  # I2C (shared by ES8311, ES7210, AW9523, touch, proximity sensor)
  i2c_sda: GPIO5
  i2c_scl: GPIO4
  i2c_addr_es8311: "0x18"
  i2c_addr_es7210: "0x40"
  i2c_addr_aw9523: "0x59"
  i2c_addr_proximity: "0x39"

  # I2S (shared by ES8311 and ES7210)
  i2s_mclk: GPIO47
  i2s_bclk: GPIO14
  i2s_lrclk: GPIO13
  i2s_dout: GPIO12   # ESP -> ES8311 (net ES_DAIN)
  i2s_din: GPIO21    # ES7210 -> ESP (net ES_ADOUT)

  # AW9523 pins: 0-7 = P0_0..P0_7, 8-15 = P1_0..P1_7
  aw9523_pa_ctrl: "13"   # P1_5, HT6872 amplifier enable (net ES_CTRL)
  aw9523_lcd_rst: "14"   # P1_6, LCD + touch reset

  # LCD: ST7796U on an 8-bit 8080 bus
  lcd_wr: GPIO10
  lcd_dc: GPIO45
  lcd_d0: GPIO9
  lcd_d1: GPIO3
  lcd_d2: GPIO8
  lcd_d3: GPIO18
  lcd_d4: GPIO17
  lcd_d5: GPIO16
  lcd_d6: GPIO15
  lcd_d7: GPIO7
  touch_int: GPIO6

  # Voice assistant UI phases (see globals.voice_assistant_phase)
  va_phase_not_connected: "0"
  va_phase_idle: "1"
  va_phase_listening: "2"
  va_phase_thinking: "3"
  va_phase_replying: "4"
  va_phase_error: "5"
  va_phase_timer_done: "6"
  va_phase_follow_up: "7"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.9.0
  project:
    name: agrucza.esp32-agent-dev-kit
    version: "1.0.0"
  on_boot:
    priority: -100
    then:
      # micro_wake_word loads its models late; wait for it instead of guessing a delay.
      - wait_until:
          condition:
            lambda: return id(mww).is_ready();
          timeout: 10s
      - script.execute: start_wake_word
      - script.execute: set_idle_phase
      - script.execute:
          id: draw_volume
          level: 50
      - script.execute: apply_language

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

external_components:
  # Components ESPHome core lacks, kept in this repo (Apache-2.0):
  #   aw9523    - IO expander / LED driver (amplifier enable, LCD reset, backlight)
  #   mipi_i80  - 8080 / i80 parallel display driver (ST7796U)
  #   i2s_audio - ESPHome's own component plus a full-duplex mode (duplex: true), so the
  #               codec clocks never stop while microphone and speaker take turns
  #   mkpb2016ps - the board's IR proximity sensor (presence wakes the screen)
  #   voice_assistant - ESPHome's own component with two fixes for "continue conversation"
  #               (stale continue flag, TTS queued behind a chime), see the file header
  # examples/agent-devkit-local.yaml points components_source at the checkout instead.
  - source: ${components_source}
    components: [aw9523, mipi_i80, i2s_audio, mkpb2016ps, voice_assistant]
    refresh: 1d

dashboard_import:
  package_import_url: github://agrucza/esp32-agent-dev-kit-esphome/agent-devkit.yaml@main
  import_full_config: false

logger:
  level: DEBUG
  # ESP32-S3 defaults to the native USB-JTAG console (rear USB-C). The CH343P on the
  # bottom USB-C is wired to UART0, so force logs there.
  hardware_uart: UART0

# Users add their own encryption key under api: in their config.
api:
  on_client_connected:
    - script.execute: start_wake_word
    - script.execute: set_idle_phase
  on_client_disconnected:
    - script.execute: set_idle_phase

ota:
  - platform: esphome
    id: ota_esphome

# Users add ssid/password under wifi: in their config; the fallback hotspot is open.
wifi:
  # Mains powered voice satellite: keep latency low.
  power_save_mode: none
  ap:

improv_serial:

captive_portal:

i2c:
  - id: bus_a
    sda: ${i2c_sda}
    scl: ${i2c_scl}
    frequency: 400kHz
    scan: true

aw9523:
  - id: io_expander
    i2c_id: bus_a
    address: ${i2c_addr_aw9523}
    led_current_limit: 37mA

switch:
  - platform: template
    id: mute
    name: Mute
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - micro_wake_word.stop:
      - script.execute: end_follow_up
      - lvgl.widget.update:
          id: mute_button
          state:
            checked: true
      - lvgl.label.update:
          id: mute_label
          text: !lambda |-
            return std::string(id(ui_language).current_option() == "Deutsch" ? "STUMM" : "MUTED");
          text_color: 0x10060B
      - script.execute: set_idle_phase
    on_turn_off:
      - lvgl.widget.update:
          id: mute_button
          state:
            checked: false
      - lvgl.label.update:
          id: mute_label
          text: !lambda |-
            return std::string(id(ui_language).current_option() == "Deutsch" ? "STUMM" : "MUTE");
          text_color: 0x00E5FF
      - script.execute: start_wake_word
      - script.execute: set_idle_phase
  # Follow-up listening (what Alexa calls follow-up mode): after an answer the microphone
  # stays open for "Follow-up timeout" seconds, so the next question needs no wake word.
  # Chains as long as you keep talking; silence, a tap or an error ends it.
  - platform: template
    id: continue_conversation
    name: Continue conversation
    icon: mdi:comment-multiple-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_off:
      - script.execute: end_follow_up
  # Rings the timer chime in a loop until dismissed by touch, wake word, Home Assistant, or
  # after two minutes.
  - platform: template
    id: timer_ringing
    name: Timer ringing
    icon: mdi:alarm-bell
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: diagnostic
    on_turn_on:
      - lambda: |-
          id(speaker_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_ONE)
              .set_announcement(true)
              .perform();
          id(speaker_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 1000);
      - media_player.speaker.play_on_device_media_file:
          media_file: test_sound
          announcement: true
      - delay: 2min
      - switch.turn_off: timer_ringing
    on_turn_off:
      - lambda: |-
          id(speaker_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_OFF)
              .set_announcement(true)
              .perform();
          id(speaker_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);
      - media_player.stop:
          id: speaker_media_player
          announcement: true
      - script.execute: set_idle_phase
      - script.execute: draw_timer
      - script.execute: dim_after_conversation
  # HT6872 class-D amplifier enable. Always on, like the vendor firmware: with the duplex I2S
  # bus the codec clocks never stop, so there is nothing to pop.
  - platform: gpio
    id: amplifier_enable
    name: Speaker amplifier
    icon: mdi:amplifier
    restore_mode: ALWAYS_ON
    entity_category: config
    pin:
      aw9523: io_expander
      number: ${aw9523_pa_ctrl}
      mode:
        output: true

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: ${i2s_lrclk}
    i2s_bclk_pin: ${i2s_bclk}
    i2s_mclk_pin: ${i2s_mclk}
    # One TX+RX pair that runs from the first use on; see components/i2s_audio.
    duplex: true

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_a
    address: ${i2c_addr_es7210}
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    address: ${i2c_addr_es8311}
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: box_mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: ${i2s_din}
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: ${i2s_dout}
    dac_type: external
    audio_dac: es8311_dac
    # Duplex bus: speaker and microphone share the clocks, so both run at 16 kHz / 16 bit
    # (the vendor firmware's setting). "secondary" pins the stream rate so the media player
    # resamples to it instead of trying to reconfigure the bus.
    i2s_mode: secondary
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left
    buffer_duration: 100ms

media_player:
  - platform: speaker
    id: speaker_media_player
    name: None
    volume_min: 0.4
    volume_max: 0.8
    announcement_pipeline:
      speaker: box_speaker
      format: FLAC
      sample_rate: 16000
      num_channels: 1
    # Bundled sounds must already match the announcement pipeline (16 kHz, mono): Home
    # Assistant transcodes TTS to that format, local files are played as they are.
    # timer_finished.flac is the Home Assistant Voice PE chime (Apache-2.0), downsampled.
    files:
      - id: test_sound
        file: sounds/timer_finished.flac
      - id: wake_sound
        file: sounds/wake.flac
      - id: command_sound
        file: sounds/command.flac
      - id: error_sound
        file: sounds/error.flac
    # The microphone and speaker share one I2S bus, so the wake word engine must
    # release the microphone before playback starts, and resume afterwards.
    # With the duplex bus the microphone keeps running during playback, so the wake word
    # stays armed and can interrupt an answer.
    on_idle:
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - script.execute: start_wake_word

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic
  - platform: factory_reset
    name: Factory reset
    entity_category: diagnostic
  - platform: template
    name: Restart wake word
    icon: mdi:ear-hearing
    entity_category: diagnostic
    on_press:
      - script.execute: start_wake_word
  - platform: template
    name: Play test sound
    icon: mdi:music-note
    on_press:
      - media_player.speaker.play_on_device_media_file:
          media_file: test_sound
          announcement: true

micro_wake_word:
  id: mww
  microphone: box_mic
  # Stock models. Add your own in your config (see README, "Custom wake words"); package
  # lists merge, so they are added to these. Home Assistant's wake word selector on the
  # device page decides which of them are active.
  models:
    - okay_nabu
    - hey_jarvis
  on_wake_word_detected:
    - script.execute: wake_screen
    - switch.turn_off: timer_ringing
    # A wake word always starts a plain request: drop any follow-up window state.
    - script.stop: start_follow_up
    - lambda: |-
        id(follow_up_block) = false;
        if (id(follow_up_active)) {
          id(follow_up_active) = false;
          id(voice_assistant_phase) = ${va_phase_listening};
          id(draw_display).execute();
        }
    - text_sensor.template.publish:
        id: last_wake_word
        state: !lambda return wake_word;
    - if:
          condition:
            api.connected:
          then:
            - media_player.speaker.play_on_device_media_file:
                media_file: wake_sound
                announcement: true
            - voice_assistant.start:
                wake_word: !lambda return wake_word;
          else:
            # No Home Assistant yet: acknowledge with the chime and keep listening.
            - media_player.speaker.play_on_device_media_file:
                media_file: test_sound
                announcement: true
            - delay: 1s
            - script.execute: start_wake_word

voice_assistant:
  id: va
  microphone: box_mic
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - text_sensor.template.publish:
        id: text_request
        state: ""
    - text_sensor.template.publish:
        id: text_response
        state: ""
    - lambda: |-
        // A follow-up window keeps its countdown look until someone actually speaks.
        if (!id(follow_up_active)) id(voice_assistant_phase) = ${va_phase_listening};
    - script.execute: draw_display
  on_stt_vad_start:
    # Someone started talking: the follow-up countdown is over, this is a normal request now.
    - if:
        condition:
          lambda: return id(follow_up_active);
        then:
          - script.stop: start_follow_up
          - lambda: id(voice_assistant_phase) = ${va_phase_listening};
          - script.execute: draw_display
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${va_phase_thinking};
    - script.execute: draw_display
  on_stt_end:
    - media_player.speaker.play_on_device_media_file:
        media_file: command_sound
        announcement: true
    - text_sensor.template.publish:
        id: text_request
        state: !lambda return x;
    - script.execute: draw_display
  on_tts_start:
    - lambda: id(follow_up_eligible) = true;
    - text_sensor.template.publish:
        id: text_response
        state: !lambda return x;
    - lambda: id(voice_assistant_phase) = ${va_phase_replying};
    - script.execute: draw_display
  on_end:
    - script.stop: start_follow_up
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                speaker.is_playing:
    # The voice assistant goes idle in the same loop pass as the speaker, so give it a moment.
    # If it is still running after that, Home Assistant reopened the microphone itself (its
    # "continue conversation" for questions); the window then only adds the countdown and
    # the device-side timeout, voice_assistant.start is a no-op.
    - wait_until:
        condition:
          not:
            voice_assistant.is_running:
        timeout: 1s
    - if:
        condition:
          lambda: |-
            // Open a follow-up window only after a run that actually spoke an answer
            // (follow_up_eligible, set by on_tts_start). A run that ended any other way, for
            // example cancelled by Home Assistant, must not reopen the microphone, or the two
            // sides chase each other in a restart loop. Also not after a silent window or an
            // error (follow_up_block), and not while muted.
            const bool open = id(continue_conversation).state && id(follow_up_eligible) &&
                              !id(follow_up_block) && !id(mute).state &&
                              api::global_api_server->is_connected();
            id(follow_up_eligible) = false;
            id(follow_up_block) = false;
            id(follow_up_active) = false;
            return open;
        then:
          - script.execute: start_follow_up
        else:
          - script.execute: start_wake_word
          - if:
              condition:
                not:
                  voice_assistant.is_running:
              then:
                - script.execute: set_idle_phase
          - script.execute: dim_after_conversation
  on_error:
    - script.stop: start_follow_up
    - lambda: |-
        // A follow-up window that closes on silence is not a fault. Any other error ends the
        // follow-up chain: no new window after the one that follows.
        id(follow_up_silent) = id(follow_up_block) ||
                               (id(follow_up_active) && code == "stt-no-text-recognized");
        id(follow_up_active) = false;
        id(follow_up_block) = true;
    - if:
        condition:
          lambda: return id(follow_up_silent);
        then:
          - logger.log: "follow-up: window closed without speech"
        else:
          - lambda: |-
              id(voice_assistant_phase) = ${va_phase_error};
              id(error_shown_at) = millis();
          - script.execute: draw_display
          - media_player.speaker.play_on_device_media_file:
              media_file: error_sound
              announcement: true
          - delay: 2s
    - script.execute: start_wake_word
    - script.execute: set_idle_phase
    - script.execute: dim_after_conversation
  on_client_connected:
    - script.execute: start_wake_word
  on_client_disconnected:
    - script.stop: start_follow_up
    - lambda: |-
        id(follow_up_active) = false;
        id(follow_up_block) = false;
    - voice_assistant.stop:
  # Timers run on the device once Home Assistant has handed them over ("set a timer for 5 minutes").
  on_timer_started:
    - script.execute: draw_timer
  on_timer_updated:
    - script.execute: draw_timer
  on_timer_cancelled:
    - script.execute: draw_timer
  on_timer_tick:
    - script.execute: draw_timer
  on_timer_finished:
    - script.execute: wake_screen
    - switch.turn_on: timer_ringing
    - lambda: id(voice_assistant_phase) = ${va_phase_timer_done};
    - script.execute: draw_display

sensor:
  # IR proximity sensor on the microphone flex. Raw counts; "Presence threshold" decides what
  # counts as someone standing in front of the device. On the unit this was developed on the
  # sensor reads fine but never sees a reflection (no window in the bezel?), so the threshold
  # defaults to the maximum and presence detection is effectively off until you lower it.
  - platform: mkpb2016ps
    id: proximity
    name: Proximity
    i2c_id: bus_a
    address: ${i2c_addr_proximity}
    update_interval: 250ms
    led_drive: 125mA
    pulse_count: 32
    gain: 4
    entity_category: diagnostic
    filters:
      - delta: 10

number:
  - platform: template
    id: presence_threshold
    name: Presence threshold
    icon: mdi:motion-sensor
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 65535
    step: 10
    initial_value: 65535
    unit_of_measurement: counts
  # How long the follow-up window waits for the first word. Home Assistant gives up on its own
  # after 15 s of silence, so the slider cannot go beyond that.
  - platform: template
    id: follow_up_timeout
    name: Follow-up timeout
    icon: mdi:timer-sand
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 15
    step: 1
    initial_value: 8
    unit_of_measurement: s
    mode: slider

binary_sensor:
  - platform: template
    id: presence
    name: Presence
    device_class: occupancy
    lambda: return id(proximity).state > id(presence_threshold).state;
    filters:
      - delayed_off: 2s
    on_press:
      - script.execute: wake_screen

select:
  - platform: template
    id: ui_language
    name: UI language
    icon: mdi:translate
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - English
      - Deutsch
    initial_option: English
    on_value:
      - script.execute: apply_language

text_sensor:
  - platform: template
    id: last_wake_word
    name: Last wake word
    icon: mdi:ear-hearing
    entity_category: diagnostic
  - platform: template
    id: text_request
    name: Request
    icon: mdi:account-voice
  - platform: template
    id: text_response
    name: Response
    icon: mdi:reply

script:
  - id: wake_screen
    mode: restart
    then:
      - script.stop: dim_after_conversation
      - light.turn_on:
          id: backlight
          brightness: 100%
  # Dim 30 s after a conversation or a dismissed timer; touch and wake word cancel it.
  - id: dim_after_conversation
    mode: restart
    then:
      - delay: 30s
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - switch.is_off: timer_ringing
          then:
            - light.turn_on:
                id: backlight
                brightness: 15%
  # Follow-up window: listen again without a wake word, drain the outer ring over
  # "Follow-up timeout" seconds, and stop the pipeline if nobody has started talking by then.
  - id: start_follow_up
    mode: restart
    then:
      - lambda: |-
          id(follow_up_active) = true;
          id(voice_assistant_phase) = ${va_phase_follow_up};
          const int secs = (int) id(follow_up_timeout).state;
          const uint32_t ms = (uint32_t) secs * 1000;
          lv_anim_del(id(follow_arc), nullptr);
          lv_anim_del(id(follow_digits), nullptr);
          lv_arc_set_value(id(follow_arc), 1000);
          lv_label_set_text_fmt(id(follow_digits), "%d", secs);
          // LVGL animates both the arc and the digits; no periodic code needed.
          lv_anim_t a;
          lv_anim_init(&a);
          lv_anim_set_var(&a, id(follow_arc));
          lv_anim_set_values(&a, 1000, 0);
          lv_anim_set_time(&a, ms);
          lv_anim_set_exec_cb(&a, [](void *obj, int32_t v) { lv_arc_set_value((lv_obj_t *) obj, v); });
          lv_anim_start(&a);
          lv_anim_t d;
          lv_anim_init(&d);
          lv_anim_set_var(&d, id(follow_digits));
          lv_anim_set_values(&d, secs * 10, 0);
          lv_anim_set_time(&d, ms);
          lv_anim_set_exec_cb(&d, [](void *obj, int32_t v) {
            lv_label_set_text_fmt((lv_obj_t *) obj, "%d", (int) ((v + 9) / 10));
          });
          lv_anim_start(&d);
      - script.execute: wake_screen
      - script.execute: draw_display
      # The media player's on_idle may have re-armed the wake word engine a moment ago (the
      # voice assistant can go idle before playback ends); the pipeline alone listens now.
      - micro_wake_word.stop:
      - voice_assistant.start:
      - delay: !lambda return (uint32_t) id(follow_up_timeout).state * 1000;
      - if:
          condition:
            lambda: return id(follow_up_active) && id(voice_assistant_phase) == ${va_phase_follow_up};
          then:
            - logger.log: "follow-up: nobody spoke, closing the window"
            - script.execute: end_follow_up
  # Close an open follow-up window (timeout, tap, mute, switch off). Stopping the pipeline makes
  # Home Assistant answer with "no text recognized" and a run end, which on_error / on_end
  # treat as a quiet end thanks to follow_up_block.
  - id: end_follow_up
    then:
      - if:
          condition:
            lambda: return id(follow_up_active);
          then:
            - lambda: |-
                id(follow_up_active) = false;
                id(follow_up_block) = true;
            - voice_assistant.stop:
            - script.execute: start_wake_word
            - script.execute: set_idle_phase
            - script.execute: dim_after_conversation
  - id: draw_display
    mode: restart
    then:
      - lambda: |-
          // HUD colours per phase: accent, label, sub label
          const bool de = id(ui_language).current_option() == "Deutsch";
          uint32_t accent = 0x2B3647;
          const char *label = de ? "BEREIT" : "STANDBY";
          // Idle hint names the first configured wake word ("hey_sarah" -> HEY SARAH).
          static char hint[48];
          {
            // First model that is enabled (Home Assistant's wake word selector switches them).
            std::string word;
            for (auto *m : id(mww).get_wake_words()) {
              if (m->is_enabled()) { word = m->get_wake_word(); break; }
            }
            if (word.empty()) word = "OKAY NABU";
            for (auto &c : word) c = (c == '_') ? ' ' : (char) toupper((unsigned char) c);
            snprintf(hint, sizeof hint, "%s \"%s\"", de ? "SAG" : "SAY", word.c_str());
          }
          const char *sub = hint;
          bool hollow = true; bool show_a = false, show_b = false;
          switch (id(voice_assistant_phase)) {
            case ${va_phase_idle}:
              if (id(mute).state) { label = de ? "STUMM" : "MUTED"; sub = de ? "MIKRO AUS" : "MIC CLOSED"; accent = 0xFF2B74; }
              break;
            case ${va_phase_listening}: accent = 0x00E5FF; label = de ? "HÖRE ZU" : "LISTENING";    sub = de ? "MIKRO OFFEN" : "MIC OPEN";       show_a = true; break;
            case ${va_phase_follow_up}: accent = 0x00E5FF; label = de ? "HÖRE ZU" : "LISTENING";    sub = de ? "WEITER OHNE WECKWORT" : "NO WAKE WORD NEEDED"; break;
            case ${va_phase_thinking}:  accent = 0xFFC400; label = de ? "DENKE" : "PROCESSING";     sub = de ? "ABSICHT // LLM" : "INTENT // LLM"; show_b = true; hollow = false; break;
            case ${va_phase_replying}:  accent = 0xFF2B74; label = de ? "ANTWORTE" : "REPLYING";    sub = "TTS // PIPER";  hollow = false; break;
            case ${va_phase_error}:     accent = 0xFF3B3B; label = de ? "FEHLER" : "FAULT";         sub = de ? "PIPELINE-FEHLER" : "PIPELINE ERROR"; break;
            case ${va_phase_timer_done}: accent = 0xFF2B74; label = de ? "TIMER FERTIG" : "TIMER DONE"; sub = de ? "TIPPEN ZUM BEENDEN" : "TAP TO DISMISS"; break;
            default:                    accent = 0xFF3B3B; label = de ? "KEIN LINK" : "NO LINK";    sub = de ? "WARTE AUF HOME ASSISTANT" : "WAITING FOR HOME ASSISTANT"; break;
          }
          lv_color_t c = lv_color_hex(accent);
          const bool timer_done = id(voice_assistant_phase) == ${va_phase_timer_done};
          const bool timer_core = id(timer_active) || timer_done;
          // timer owns the ring: arc + digits instead of ring + disc
          if (timer_core) {
            lv_color_t tc = lv_color_hex(timer_done ? 0xFF2B74 : 0xFFC400);
            lv_obj_set_style_arc_color(id(timer_arc), tc, LV_PART_INDICATOR);
            lv_obj_set_style_text_color(id(timer_digits), tc, 0);
            lv_obj_set_style_text_color(id(timer_tag), tc, 0);
            if (timer_done) { lv_arc_set_value(id(timer_arc), 1000); lv_label_set_text(id(timer_digits), "00:00"); }
            lv_obj_clear_flag(id(timer_arc), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(timer_digits), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(timer_tag), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(ring_main), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(phase_disc), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(timer_arc), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(timer_digits), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(timer_tag), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(ring_main), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(phase_disc), LV_OBJ_FLAG_HIDDEN);
          }
          // follow-up window: the outer ring drains, the seconds sit in the hollow disc
          if (id(voice_assistant_phase) == ${va_phase_follow_up}) {
            lv_obj_clear_flag(id(follow_arc), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(ring_thin), LV_OBJ_FLAG_HIDDEN);
            if (timer_core) lv_obj_add_flag(id(follow_digits), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_clear_flag(id(follow_digits), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_anim_del(id(follow_arc), nullptr);
            lv_anim_del(id(follow_digits), nullptr);
            lv_obj_add_flag(id(follow_arc), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(follow_digits), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(ring_thin), LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_set_style_border_color(id(ring_main), c, 0);
          lv_obj_set_style_border_color(id(phase_disc), c, 0);
          lv_obj_set_style_bg_color(id(phase_disc), c, 0);
          lv_obj_set_style_bg_opa(id(phase_disc), hollow ? LV_OPA_TRANSP : LV_OPA_COVER, 0);
          lv_obj_t *frames[] = {id(frame_tl)->obj, id(frame_tr)->obj, id(frame_bl)->obj, id(frame_br)->obj};
          for (auto *f : frames) lv_obj_set_style_line_color(f, c, 0);
          lv_label_set_text(id(phase_label), label);
          lv_obj_set_style_text_color(id(phase_label), id(voice_assistant_phase) == ${va_phase_idle} && !id(mute).state ? lv_color_hex(0xD7E3F0) : c, 0);
          lv_label_set_text(id(phase_sub), sub);
          if (show_a) lv_obj_clear_flag(id(spin_a), LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(id(spin_a), LV_OBJ_FLAG_HIDDEN);
          if (show_b) lv_obj_clear_flag(id(spin_b), LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(id(spin_b), LV_OBJ_FLAG_HIDDEN);
          lv_label_set_text(id(request_label), id(text_request).state.c_str());
          lv_label_set_text(id(response_label), id(text_response).state.c_str());
  - id: apply_language
    mode: restart
    then:
      - lambda: |-
          const bool de = id(ui_language).current_option() == "Deutsch";
          lv_label_set_text(id(you_tag), de ? "> DU" : "> YOU");
          lv_label_set_text(id(mute_label), id(mute).state ? (de ? "STUMM" : "MUTED") : (de ? "STUMM" : "MUTE"));
      - script.execute: draw_display
  - id: draw_timer
    mode: restart
    then:
      - lambda: |-
          // The first active timer (the one that ends soonest) takes over the ring.
          const voice_assistant::Timer *t = nullptr;
          for (const auto &x : id(va).get_timers()) {
            if (x.is_active && (t == nullptr || x.seconds_left < t->seconds_left)) t = &x;
          }
          id(timer_active) = (t != nullptr);
          if (t != nullptr) {
            uint32_t h = t->seconds_left / 3600, m = (t->seconds_left % 3600) / 60, sec = t->seconds_left % 60;
            if (h > 0) lv_label_set_text_fmt(id(timer_digits), "%u:%02u:%02u", (unsigned) h, (unsigned) m, (unsigned) sec);
            else lv_label_set_text_fmt(id(timer_digits), "%02u:%02u", (unsigned) m, (unsigned) sec);
            uint32_t total = t->total_seconds > 0 ? t->total_seconds : 1;
            lv_arc_set_value(id(timer_arc), (int32_t) (1000 * t->seconds_left / total));
          }
      - script.execute: draw_display
  - id: draw_volume
    mode: restart
    parameters:
      level: int
    then:
      - lambda: |-
          lv_obj_t *segs[] = {id(seg0), id(seg1), id(seg2), id(seg3), id(seg4), id(seg5), id(seg6), id(seg7),
                              id(seg8), id(seg9), id(seg10), id(seg11), id(seg12), id(seg13), id(seg14), id(seg15)};
          int lit = (level * 16 + 50) / 100;
          for (int i = 0; i < 16; i++) {
            uint32_t col = i >= lit ? 0x1A2433 : (i >= 11 ? 0xFF2B74 : 0x00E5FF);
            lv_obj_set_style_bg_color(segs[i], lv_color_hex(col), 0);
          }
          lv_label_set_text_fmt(id(vol_value), "%d", level);
  - id: set_idle_phase
    then:
      - lambda: |-
          id(voice_assistant_phase) = api::global_api_server->is_connected() ? ${va_phase_idle} : ${va_phase_not_connected};
      - lambda: |-
          bool up = api::global_api_server->is_connected();
          lv_color_t c = lv_color_hex(up ? 0x00E5FF : 0xFF3B3B);
          lv_obj_set_style_bg_color(id(link_dot), c, 0);
          lv_obj_set_style_text_color(id(link_label), c, 0);
          lv_label_set_text(id(link_label), up ? "HA LINK" : "NO LINK");
      - script.execute: draw_display
  - id: start_wake_word
    # The speaker stops and the voice assistant goes idle in the same loop pass, in that order,
    # so a plain "is the VA running?" check at the moment playback ends races and loses.
    # Wait for the VA to settle instead of checking once.
    mode: restart
    then:
      - wait_until:
          condition:
            not:
              - voice_assistant.is_running:
          timeout: 10s
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - switch.is_off: mute
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
          else:
            - logger.log:
                level: WARN
                format: "start_wake_word: not restarting (voice assistant still running or muted)"

# ---------------------------------------------------------------------------
# Display: ST7796U 320x480 on an 8-bit 8080 bus, reset and backlight via AW9523
# ---------------------------------------------------------------------------
display:
  - platform: mipi_i80
    id: lcd
    model: ST7796_AD35
    data_pins:
      - ${lcd_d0}
      - ${lcd_d1}
      - ${lcd_d2}
      - ${lcd_d3}
      - ${lcd_d4}
      - ${lcd_d5}
      - ${lcd_d6}
      - ${lcd_d7}
    wr_pin: ${lcd_wr}
    dc_pin: ${lcd_dc}
    panel_select_pins:
      - ${lcd_d0}
      - ${lcd_d3}
    reset_pin:
      aw9523: io_expander
      number: ${aw9523_lcd_rst}
      mode:
        output: true
    pclk_frequency: 20MHz  # ST7796 8-bit write timing; 40 MHz corrupts the image
    # Vendor default orientation is MADCTL 0x48 (mirror X, BGR); rotate 90 for landscape.
    transform:
      mirror_x: true
    update_interval: never
    auto_clear_enabled: false

font:
  # HUD typography: Orbitron for labels, Share Tech Mono for the terminal and values.
  - file: gfonts://Orbitron@700
    id: f_display_11
    size: 11
    bpp: 4
  - file: gfonts://Orbitron@700
    id: f_display_10
    size: 10
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: gfonts://Orbitron@700
    id: f_display_20
    size: 20
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: gfonts://Share+Tech+Mono
    id: f_mono_11
    size: 11
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: gfonts://Share+Tech+Mono
    id: f_mono_13
    size: 13
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: gfonts://Share+Tech+Mono
    id: f_mono_34
    size: 34
    bpp: 4
    glyphs: "0123456789:"

image:
  - file: images/grid.png
    id: grid_img
    type: RGB565

output:
  # The six AW9523 LED-mode outputs driving the backlight in parallel (vendor firmware: 37 mA max,
  # duty 128/255 at boot).
  - platform: aw9523
    id: bl0
    aw9523: io_expander
    pin: 8
  - platform: aw9523
    id: bl1
    aw9523: io_expander
    pin: 9
  - platform: aw9523
    id: bl2
    aw9523: io_expander
    pin: 10
  - platform: aw9523
    id: bl3
    aw9523: io_expander
    pin: 11
  - platform: aw9523
    id: bl4
    aw9523: io_expander
    pin: 0
  - platform: aw9523
    id: bl5
    aw9523: io_expander
    pin: 1
  - platform: template
    id: backlight_output
    type: float
    write_action:
      - output.set_level:
          id: bl0
          level: !lambda return state;
      - output.set_level:
          id: bl1
          level: !lambda return state;
      - output.set_level:
          id: bl2
          level: !lambda return state;
      - output.set_level:
          id: bl3
          level: !lambda return state;
      - output.set_level:
          id: bl4
          level: !lambda return state;
      - output.set_level:
          id: bl5
          level: !lambda return state;

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    icon: mdi:brightness-6
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms
    initial_state:
      brightness: 100%

touchscreen:
  - platform: ft63x6
    id: touch
    i2c_id: bus_a
    interrupt_pin: ${touch_int}
    display: lcd
    on_touch:
      - script.execute: wake_screen
      - switch.turn_off: timer_ringing
      - script.execute: end_follow_up
    # From a 5-point tap test on 2026-10-11 (raw = 1.035*x + 5, raw = 0.976*y + 6).
    calibration:
      x_min: 5
      x_max: 336
      y_min: 6
      y_max: 474
# Safety net for the status screen: event hooks (on_listening, on_end, on_error) are deferred
# and can land in a different order than the state changes they describe. Converge to standby
# whenever nothing is actually running (but leave a ringing timer alone).
interval:
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing:
              - switch.is_off: timer_ringing
              - lambda: |-
                  if (id(voice_assistant_phase) == ${va_phase_error} && millis() - id(error_shown_at) < 2000)
                    return false;
                  return id(voice_assistant_phase) != ${va_phase_idle} &&
                         id(voice_assistant_phase) != ${va_phase_not_connected};
          then:
            - logger.log:
                format: "status screen: phase %d while idle, correcting"
                args: [id(voice_assistant_phase)]
            - script.execute: set_idle_phase

  # Redraw the idle hint when Home Assistant enables or disables wake words.
  - interval: 2s
    then:
      - lambda: |-
          uint32_t sig = 0;
          for (auto *m : id(mww).get_wake_words()) sig = (sig << 1) | (m->is_enabled() ? 1 : 0);
          if (sig != id(wake_word_signature)) {
            id(wake_word_signature) = sig;
            id(draw_display).execute();
          }

globals:
  - id: wake_word_signature
    type: uint32_t
    initial_value: "0xFFFFFFFF"
  - id: voice_assistant_phase
    type: int
    initial_value: ${va_phase_not_connected}
  - id: error_shown_at
    type: uint32_t
    initial_value: "0"
  - id: timer_active
    type: bool
    initial_value: "false"
  # Follow-up window state, see start_follow_up / end_follow_up.
  - id: follow_up_active
    type: bool
    initial_value: "false"
  - id: follow_up_block
    type: bool
    initial_value: "false"
  - id: follow_up_silent
    type: bool
    initial_value: "false"
  - id: follow_up_eligible
    type: bool
    initial_value: "false"

# ---------------------------------------------------------------------------
# LVGL user interface (portrait 320x480)
# ---------------------------------------------------------------------------
lvgl:
  displays: [lcd]
  touchscreens: [touch]
  buffer_size: 25%
  color_depth: 16
  byte_order: big_endian
  default_font: f_mono_13
  disp_bg_color: 0x070B12
  # Dim the backlight after a minute without touch; any touch or voice activity restores it.
  # Not in the middle of a conversation, though (a follow-up chain easily runs longer than a
  # minute): dim_after_conversation takes over once it ends.
  on_idle:
    - timeout: 60s
      then:
        - if:
            condition:
              not:
                voice_assistant.is_running:
            then:
              - light.turn_on:
                  id: backlight
                  brightness: 15%
  pages:
    - id: main_page
      bg_color: 0x070B12
      bg_image_src: grid_img
      bg_image_tiled: true
      pad_all: 0
      scrollbar_mode: "OFF"
      widgets:
        # ---- top bar ----
        - label:
            text: "AGENT // DEVKIT"
            text_font: f_display_11
            text_color: 0x00E5FF
            text_letter_space: 2
            align: TOP_LEFT
            x: 12
            y: 12
        - obj:
            id: link_dot
            width: 8
            height: 8
            radius: 0
            border_width: 0
            bg_color: 0xFF3B3B
            align: TOP_RIGHT
            x: -66
            y: 13
        - label:
            id: link_label
            text: "NO LINK"
            text_font: f_mono_11
            text_color: 0xFF3B3B
            text_letter_space: 1
            align: TOP_RIGHT
            x: -12
            y: 11
        - obj:
            width: 296
            height: 1
            x: 12
            y: 33
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
        - obj:
            width: 1
            height: 5
            x: 12
            y: 29
            radius: 0
            border_width: 0
            bg_color: 0x00E5FF
            bg_opa: 60%
